# Catálogo preliminar de KPIs — Fase 1 / Semana 2 (Análisis del problema)
# Cada KPI se calculará en la Capa Gold a partir de datos ya limpios en Silver.
#
# Nota (Fase 4, decisión con Eduardo del 11 sep 2026): los datasets de income
# y credit_history no comparten un cliente real con el dataset de
# transacciones. Los KPIs marcados con "nota_fase4" abajo se calcularán con
# un ingreso e historial crediticio simulados (Opción A), ver
# docs/fase4_diseno_capa_gold.md y docs/fase4_datos_simulados_ingreso_credito.md.
#
# Moneda (decisión del 25 sep 2026): todos los montos están en USD, la moneda
# original del dataset de transacciones (clientes de EE.UU.).

kpis:
  - id: prob_impago
    nombre: "Probabilidad de impago"
    definicion: >
      Probabilidad estimada de que un cliente incumpla sus obligaciones de
      crédito en los próximos 12 meses.
    formula: >
      Salida de un modelo de clasificación (XGBoost/LightGBM) entrenado sobre
      historial de pagos: P_impago = f(ingresos, historial_crediticio,
      balance_transaccional) en el rango [0, 1]
    fuente:
      dataset: "Loan Default Prediction Dataset (Kaggle)"
      columnas: [income, credit_history, loan_amount, default]
    capa: "Gold"
    nota_fase4: >
      Calculado en src/ml/modelo_impago.py (paso modelo_prob_impago del DAG,
      tabla data/gold/prob_impago_cliente). Regresión logística en vez de
      XGBoost/LightGBM: mismo AUC (~0.75) y es explicable. Entrenado con los
      255,347 préstamos de Loan Default; usa ingreso_mensual_fuente, el DTI
      calculado y las demás variables del préstamo, nunca el ingreso simulado.
      Es la probabilidad del préstamo asignado con la llave sintética, no la
      de un cliente real. Detalle en docs/fase5_modelo_impago.md.

  - id: flujo_efectivo_proyectado
    nombre: "Flujo de efectivo proyectado"
    definicion: >
      Estimación del efectivo disponible del cliente en los próximos 1, 3 y
      6 meses.
    formula: >
      Flujo_proyectado(t) = ingreso_promedio_mensual - gasto_promedio_mensual,
      ajustado con bandas de confianza del simulador Monte Carlo
    fuente:
      dataset: "Credit Card Transactions Fraud Detection Dataset (Kaggle)"
      columnas: [amt, category, trans_date_trans_time, cc_num]
    capa: "Gold"
    nota_fase4: >
      La parte de gasto ya es real (Silver); el ingreso es
      ingreso_mensual_simulado (Opción A). La base (ingreso - gasto, sin Monte
      Carlo) ya se calcula como flujo_efectivo_mensual en src/spark/gold_kpis.py.

  - id: capacidad_ahorro
    nombre: "Capacidad de ahorro mensual"
    definicion: >
      Proporción del ingreso mensual que el cliente puede destinar a ahorro
      después de gastos fijos.
    formula: "Capacidad_ahorro = (ingreso_mensual - gasto_mensual) / ingreso_mensual"
    fuente:
      dataset: "Financial Transactions Dataset - Expenses & Income (Kaggle)"
      columnas: [income, expense, date]
    capa: "Silver -> Gold"
    nota_fase4: >
      Calculado en src/spark/gold_kpis.py (tabla data/gold/kpis_cliente).
      income = ingreso_mensual_simulado (Opción A, decisión con Eduardo,
      oct 2026); expense = gasto real con tarjeta de Silver (gasto total /
      meses de actividad). Puede ser negativo.

  - id: ratio_endeudamiento
    nombre: "Ratio de endeudamiento"
    definicion: >
      DTI (debt-to-income): proporción del ingreso mensual del cliente que se
      va en el pago mensual de su préstamo.
    formula: >
      Ratio_endeudamiento = pago_mensual_prestamo / ingreso_mensual_fuente,
      con pago_mensual_prestamo = monto * r / (1 - (1 + r)^-n),
      r = tasa anual / 100 / 12, n = plazo en meses, e
      ingreso_mensual_fuente = Income / 12. Ambos mensuales, en USD.
    fuente:
      dataset: "Loan Default Prediction Dataset (Kaggle)"
      columnas: [LoanAmount, InterestRate, LoanTerm, Income]
    capa: "Gold"
    nota_fase4: >
      Decisión con Eduardo (oct 2026): DTI con fórmula propia documentada. No
      se usa el DTIRatio del dataset (no está documentado ni es reproducible).
      Reemplaza a la fórmula preliminar de Fase 1 (deuda_total / ingreso_anual).
      Solo incluye el préstamo asignado. Puede ser mayor a 1. Detalle en
      docs/fase4_decisiones_kpis.md.

  - id: tasa_exito_ingesta
    nombre: "Tasa de éxito y volumen de ingesta"
    definicion: >
      Porcentaje de ejecuciones de pipeline exitosas y volumen de registros
      procesados por corrida. Es un KPI de observabilidad técnica, no de
      negocio directamente.
    formula: "Tasa_exito = (corridas_exitosas / corridas_totales) * 100"
    fuente:
      dataset: "Logs y metadata de Apache Airflow"
      columnas: [dag_id, run_id, state, duration]
    capa: "Observabilidad (transversal)"
    implementacion: >
      Se calcula en el Panel Operativo (src/dashboard/datos.py,
      resumen_corridas) leyendo las tablas dag_run y task_instance de la base
      de Airflow. Solo cuentan las corridas terminadas (success o failed) de
      las últimas 30 del DAG bronze_ingest.
